<style>
:root{
  --void:#050505;--coal:#0c0c0c;--plate:#101010;--plate2:#161616;--hairline:#232323;
  --steel-hi:#f2f3f6;--steel-mid:#9b9ea8;--steel-low:#5f5f5f;--white:#f5f5f7;
  --red-deep:#5c0810;--red:#7d0c16;--red-hot:#a8101e;--ember:#f04f33;
  --nul:'Nulshock','Orbitron',sans-serif;
  --data:'Rajdhani',sans-serif;
  --body:'Space Grotesk',system-ui,-apple-system,sans-serif;
  --rd:18px 0 18px 0;--rd-sm:12px 0 12px 0;--rd-xs:8px 0 8px 0;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{min-height:100svh;background:var(--void);color:var(--steel-mid);
  font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom));
  overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(820px 520px at 78% -8%,rgba(168,16,30,.16),transparent 62%),
    radial-gradient(620px 460px at -8% 104%,rgba(125,12,22,.09),transparent 60%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.011) 0 1px,transparent 1px 5px)}

.card{width:100%;max-width:400px;text-align:center}

/* portrait */
.port{position:relative;width:118px;height:118px;margin:0 auto 22px;border-radius:50%}
.port::before{content:'';position:absolute;inset:-9px;border-radius:50%;
  background:conic-gradient(from 210deg,transparent 0deg,rgba(168,16,30,.75) 70deg,
    rgba(240,79,51,.5) 130deg,transparent 210deg,transparent 360deg);
  filter:blur(7px);opacity:.85;animation:halo 14s linear infinite}
@keyframes halo{to{transform:rotate(360deg)}}
.port img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;
  display:block;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 14px 40px rgba(0,0,0,.85),0 0 0 5px rgba(8,8,8,.96)}

/* identity */
.name{font-family:var(--nul);font-size:clamp(23px,6.4vw,28px);letter-spacing:.015em;
  text-transform:uppercase;line-height:1.12;
  background:linear-gradient(178deg,#fff 10%,#d2d5da 42%,#8b8f95 62%,#eef0f3 92%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.role{margin-top:13px;font-family:var(--data);font-weight:700;font-size:11.5px;
  letter-spacing:.3em;text-transform:uppercase;color:var(--red-hot)}
.role span{color:var(--steel-low);margin:0 9px}
.group{color:var(--steel-mid)}

/* company lockups */
.cos{margin-top:30px;border:1px solid var(--hairline);border-radius:var(--rd);
  background:linear-gradient(178deg,var(--plate2),var(--plate));overflow:hidden}
.cos a{display:flex;align-items:center;justify-content:center;min-height:74px;padding:18px 26px;
  border-bottom:1px solid var(--hairline);transition:background .25s}
.cos a:last-of-type{border-bottom:0}
.cos a:active{background:rgba(168,16,30,.10)}
.cos img{height:34px;width:auto;display:block;opacity:.96}
.cos .de img{height:31px}                 /* optical match: DE lockup is a touch wider */
.where{padding:11px 20px 13px;border-top:1px solid var(--hairline);
  font-family:var(--data);font-weight:600;font-size:10.5px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--steel-low)}
.where i{font-style:normal;color:var(--red-hot);margin:0 8px}

/* primary */
.save{margin-top:26px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--data);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;
  color:#fff;padding:20px 22px;border:0;border-radius:var(--rd-sm);cursor:pointer;
  text-shadow:0 1px 6px rgba(0,0,0,.45);
  background:linear-gradient(110deg,#45060c 0%,var(--red-deep) 26%,var(--red-hot) 50%,var(--red-deep) 74%,#45060c 100%);
  background-size:220% 100%;animation:flow 4.2s linear infinite;
  box-shadow:0 12px 32px rgba(70,6,12,.55);transition:transform .2s,box-shadow .25s}
@keyframes flow{to{background-position:-220% 0}}
.save:active{transform:translateY(1px);box-shadow:0 8px 22px rgba(70,6,12,.5)}
.save svg{flex-shrink:0}

/* quick actions */
.acts{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.acts a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  min-height:76px;padding:12px 4px;border:1px solid var(--hairline);border-radius:var(--rd-sm);
  background:linear-gradient(178deg,#161616,#101010);
  font-family:var(--data);font-weight:700;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--steel-mid);transition:.22s}
.acts a:active{border-color:var(--red-hot);color:#fff;background:rgba(125,12,22,.22)}
.acts svg{flex-shrink:0}

.foot{margin-top:24px;font-family:var(--data);font-weight:600;font-size:10.5px;
  letter-spacing:.24em;text-transform:uppercase;color:#3d3d3d}
.foot a{color:var(--steel-low)}

a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}

/* entrance */
.rv{opacity:0;transform:translateY(14px);animation:rise .72s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}
.d4{animation-delay:.27s}.d5{animation-delay:.35s}.d6{animation-delay:.43s}

@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none;animation:none}
  .port::before,.save{animation:none}
}
@media (min-width:430px){
  .port{width:132px;height:132px}
  .cos a{min-height:82px}
  .cos img{height:38px}.cos .de img{height:35px}

@media (max-width:359px){
  .acts a{min-height:68px;font-size:9px;letter-spacing:.1em}
  .cos img{height:30px}.cos .de img{height:27px}
}
</style>
